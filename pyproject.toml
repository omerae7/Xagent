[project]
name = "xagent"
version = "0.1.0"
description = "X Agent — کارمند دیجیتال ۲۴ساعته، خودمیزبان و فارسی"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "croniter>=2.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "jdatetime>=5.0",
  "beautifulsoup4>=4.12",
  "orjson>=3.10",
  "tzdata>=2024.1",
  "telethon>=1.36",
  "websockets>=12",
  "mcp>=1.2",
  "playwright>=1.45",
  "anthropic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [
  "packages/core",
  "packages/agent_core",
  "packages/memory",
  "packages/tools",
  "packages/crm",
  "services/api",
  "services/worker",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP040", "B904", "ASYNC109", "ASYNC240", "ASYNC230"]

[tool.ruff.lint.isort]
known-first-party = ["xagent_core", "xagent_agent", "xagent_memory", "xagent_tools", "xagent_crm", "xagent_api", "xagent_worker"]
