name: X Agent verification

on:
  push:
    branches: ["fix/**", "feat/**", "ccr-**", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Only the newest revision of a branch should consume CI resources. Earlier
# intermediate commits are superseded; both PR and push events use the same group.
concurrency:
  group: xagent-verification-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xagent_test
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xagent -d xagent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and test dependencies
        run: |
          python -m pip install uv==0.4.30
          uv pip install --system -r pyproject.toml
          uv pip install --system pytest pytest-asyncio ruff aiohttp
      - name: Python compilation
        run: python -m compileall -q packages services infra/desktop/agentd.py tests
      - name: Shell syntax
        run: |
          for f in install.sh infra/updater/*.sh infra/scripts/xagentctl infra/docker/entrypoint.sh infra/desktop/*.sh tests/updater/*.sh; do
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: Verify update-script permissions
        run: test -x infra/updater/xagent-update.sh && test -x infra/updater/bootstrap.sh && test -x infra/scripts/xagentctl && test -x tests/updater/e2e.sh
      - name: Lint
        run: ruff check packages services tests
      - name: Chromium for real browser integration tests
        run: |
          python -m playwright install --with-deps chromium
          echo "XAGENT_TEST_CHROME=$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Pytest with live PostgreSQL, Redis and Chromium
        run: pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend build and type-check
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare deployment configuration
        run: |
          cp .env.example .env
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=desktop/' .env
          echo 'RUNNER_TOKEN=test-runner-token' >> .env
          echo 'DESKTOP_TOKEN=test-desktop-token' >> .env
          echo 'POSTGRES_PASSWORD=test-password' >> .env
      - name: Validate compose
        run: docker compose config -q
      - name: Build all images
        run: docker compose --profile desktop build
      - name: HTTPS without client SNI (IP and domain, real Caddy)
        run: python3 tests/caddy_tls.py --image xagent/web:latest
      - name: Updater end-to-end (bootstrap, broken migration, unhealthy release rollback, success, manual rollback)
        run: |
          sudo git config --global --add safe.directory '*'
          sudo -E env "PATH=$PATH" bash tests/updater/e2e.sh "$RUNNER_TEMP/xagent-e2e"
