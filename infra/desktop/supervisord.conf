[supervisord]
nodaemon=true
logfile=/var/log/xagent/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
priority=10
autorestart=true

[program:xfce]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
user=agent
environment=HOME="/home/agent",DISPLAY=":1",USER="agent"
priority=20
autorestart=true
startsecs=5

; دو سرور VNC: فقط‌مشاهده (پیش‌فرض) و کنترلی (فقط هنگام Takeover از طریق پنل)
[program:vnc_view]
command=/usr/bin/x11vnc -display :1 -viewonly -shared -forever -localhost -rfbport 5900 -nopw -quiet -noxdamage -noshm
user=agent
priority=30
autorestart=true
startretries=30
startsecs=3

[program:vnc_control]
command=/usr/bin/x11vnc -display :1 -shared -forever -localhost -rfbport 5901 -nopw -quiet -noxdamage -noshm
user=agent
priority=30
autorestart=true
startretries=30
startsecs=3

[program:ws_view]
command=/usr/bin/websockify 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true

[program:ws_control]
command=/usr/bin/websockify 0.0.0.0:6081 127.0.0.1:5901
priority=40
autorestart=true

[program:chromium]
command=/opt/xagent/start-chromium.sh
user=agent
environment=HOME="/home/agent",DISPLAY=":1"
priority=50
autorestart=true
startsecs=5

; Chrome فقط روی localhost گوش می‌دهد؛ socat آن را برای شبکه داخلی داکر در دسترس می‌کند
[program:cdp_proxy]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9223
priority=55
autorestart=true

[program:agentd]
command=/usr/bin/python3 /opt/xagent/agentd.py
user=agent
environment=HOME="/home/agent",DISPLAY=":1"
priority=60
autorestart=true
